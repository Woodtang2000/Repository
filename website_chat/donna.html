<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Donna">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Donna</title>
<link rel="apple-touch-icon" href="/donna-icon.png">
<link rel="icon" href="/donna-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Donna: an executive's line, in the company navy and gold. */
  :root{--navy:#003746;--deep:#001b23;--ink:#f4f1ea;--dim:#9fb6bc;--gold:#f9af10;--gold-soft:rgba(249,175,16,.18);
        --card:rgba(255,255,255,.05);--line:rgba(249,175,16,.28)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;color:var(--ink);font:400 16px/1.45 Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;
    background:radial-gradient(120% 70% at 50% 72%,#00505f 0%,var(--navy) 38%,var(--deep) 100%) fixed;background-color:var(--deep)}
  body{display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 10px)}
  header{text-align:center;padding:18px 0 4px}
  header .rule{width:44px;height:2px;background:var(--gold);margin:0 auto 14px;border-radius:2px}
  header h1{margin:0;font:600 40px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.14em;text-transform:uppercase}
  header p{margin:8px 0 0;color:var(--dim);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
  #log{flex:1;overflow-y:auto;padding:16px 2px 8px;display:flex;flex-direction:column;gap:10px;
       mask-image:linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 10px),transparent 100%)}
  .b{max-width:84%;padding:11px 15px;border-radius:16px;font-size:16px;line-height:1.4;white-space:pre-wrap}
  .her{align-self:flex-start;background:var(--card);border:1px solid rgba(255,255,255,.07);border-left:2px solid var(--gold);
       border-top-left-radius:6px}
  .me{align-self:flex-end;background:rgba(249,175,16,.12);border:1px solid var(--line);border-top-right-radius:6px}
  .note{align-self:center;color:var(--dim);font-size:13px;text-align:center;max-width:90%}
  #controls{padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:14px}
  /* the voice orb */
  #mic{position:relative;width:148px;height:148px;border-radius:50%;border:1.5px solid var(--gold);cursor:pointer;
       background:radial-gradient(circle at 50% 38%,#0b5566 0%,var(--navy) 55%,#00262f 100%);
       box-shadow:0 0 0 8px rgba(249,175,16,.06),0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
       display:grid;place-items:center;transition:transform .15s ease,box-shadow .3s ease;-webkit-tap-highlight-color:transparent}
  #mic:active{transform:scale(.97)}
  #mic:disabled{opacity:.6}
  #mic::before,#mic::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid var(--gold);opacity:0}
  .bars{display:flex;align-items:center;gap:6px;height:46px}
  .bars i{display:block;width:5px;height:10px;border-radius:3px;background:var(--gold);opacity:.9;transition:height .2s ease}
  .bars i:nth-child(1),.bars i:nth-child(5){height:10px}.bars i:nth-child(2),.bars i:nth-child(4){height:18px}.bars i:nth-child(3){height:26px}
  /* connecting: a slow breathing ring */
  body[data-mode=connecting] #mic::before{animation:ring 1.6s ease-out infinite}
  /* listening: rings ripple out, bars breathe */
  body[data-mode=listening] #mic{box-shadow:0 0 0 8px var(--gold-soft),0 0 60px rgba(249,175,16,.25),0 18px 50px rgba(0,0,0,.45)}
  body[data-mode=listening] #mic::before{animation:ring 2s ease-out infinite}
  body[data-mode=listening] #mic::after{animation:ring 2s ease-out 1s infinite}
  body[data-mode=listening] .bars i{animation:breathe 1.4s ease-in-out infinite}
  /* speaking: the bars talk */
  body[data-mode=speaking] #mic{box-shadow:0 0 0 8px var(--gold-soft),0 0 80px rgba(249,175,16,.35),0 18px 50px rgba(0,0,0,.45)}
  body[data-mode=speaking] .bars i{animation:talk .9s ease-in-out infinite}
  .bars i:nth-child(2){animation-delay:.15s!important}.bars i:nth-child(3){animation-delay:.3s!important}
  .bars i:nth-child(4){animation-delay:.45s!important}.bars i:nth-child(5){animation-delay:.6s!important}
  @keyframes ring{0%{transform:scale(.92);opacity:.55}100%{transform:scale(1.28);opacity:0}}
  @keyframes breathe{0%,100%{transform:scaleY(.7)}50%{transform:scaleY(1.15)}}
  @keyframes talk{0%,100%{height:8px}25%{height:34px}50%{height:16px}75%{height:40px}}
  #status{color:var(--dim);font-size:11px;letter-spacing:.2em;text-transform:uppercase;min-height:16px;text-align:center}
  #typeToggle{background:none;border:0;color:var(--dim);font:500 13px Inter,sans-serif;letter-spacing:.04em;padding:4px 8px}
  form{display:flex;gap:8px;width:100%}
  #typeform{display:none}
  body.typing #typeform{display:flex}
  input{flex:1;font:16px Inter,sans-serif;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink)}
  input::placeholder{color:#6f8a91}
  button.small{font:600 15px Inter,sans-serif;padding:12px 16px;border-radius:12px;border:0;background:var(--gold);color:#1b1400}
  #setup{display:none;flex-direction:column;gap:10px;padding:24px 0}
  #setup p{color:var(--dim);margin:0;text-align:center}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head><body>
<header><div class="rule"></div><h1>Donna</h1><p id="sub">Snow White Linen · The Laundry Group</p></header>

<div id="setup">
  <p>One-time setup: paste your Donna key (from the server). It stays on this phone only.</p>
  <form id="keyform"><input id="key" type="password" autocomplete="off" placeholder="Paste key"><button class="small">Save</button></form>
</div>

<div id="log"></div>

<div id="controls">
  <button id="mic" aria-label="Talk to Donna"><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></button>
  <div id="status">Tap to talk</div>
  <button id="typeToggle" type="button">Type instead</button>
  <form id="typeform"><input id="typed" placeholder="Ask Donna…" autocomplete="off"><button class="small">Send</button></form>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let key = store.get("donnaKey") || "";
  const convo = "phone-" + (store.get("donnaConvo") || (Date.now() + "")); store.set("donnaConvo", convo.slice(6));
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let busy = false, listening = false, voice = null;

  function add(cls, text) {
    const d = document.createElement("div"); d.className = "b " + cls; d.textContent = text;
    if (cls === "note") d.className = "note";
    $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
  }
  function status(t) { $("status").textContent = t || (agent || listening ? "" : "Tap to talk"); }
  function mode(m) { if (m) document.body.dataset.mode = m; else delete document.body.dataset.mode; }

  function pickVoice() {
    const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    const like = ["Ava (Premium)", "Zoe (Premium)", "Ava (Enhanced)", "Zoe (Enhanced)", "Samantha (Enhanced)", "Ava", "Zoe", "Samantha"];
    for (const n of like) { const v = vs.find(v => v.name === n); if (v) return v; }
    return vs.find(v => /female|samantha|ava|zoe|allison|susan/i.test(v.name)) || vs[0] || null;
  }
  if ("speechSynthesis" in window) { voice = pickVoice(); speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); }; }

  // Donna's own voice (ElevenLabs, through the server). iPhone only plays sound started by a tap, so the tap that
  // sends a question also "unlocks" this player with a moment of silence; the answer then plays in it.
  const player = new Audio();
  player.setAttribute("playsinline", "");
  const SILENCE = "data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//WreyTRUoAWgBgkOAGbZHBgG1OF6zM82DWbZaUmMBptgQhGjsyYqc9ae9XFz280948NMBWInljyzsNRFLPWdnZGWrddDsjK1unuSrVN9jJsK8KuQtQCtMBjCEtImISdNKJOopIpBFpNSMbIHCSRpRR5iakjTiyzLhchUUBwCgyKiweBv/7UsQbg8isVNoMPMjAAAA0gAAABEVFGmgqK////9bP/6XCykxBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq";
  function unlock() { try { player.src = SILENCE; const p = player.play(); if (p) p.catch(() => {}); } catch (e) {} }

  // Speaks `text` and resolves when she's finished (true), or false if her own voice isn't available.
  async function voiced(text) {
    try {
      const r = await fetch("/api/donna/voice", {
        method: "POST",
        headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (r.status !== 200) return false;
      const url = URL.createObjectURL(await r.blob());
      await new Promise(done => {
        player.onended = player.onpause = done;
        player.onerror = done;
        player.src = url;
        player.play().catch(done);
      });
      return true;
    } catch (e) { return false; }
  }

  function say(text) {
    return new Promise(done => {
      if (!("speechSynthesis" in window)) return done();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.rate = 1.08;
      u.onend = u.onerror = done;
      speechSynthesis.speak(u);
    });
  }

  // A conversation: after she answers a spoken question, she listens for the reply on her own, until "goodbye".
  let talking = false;
  const DONE = /\b(good ?bye|bye|that'?s all|that is all|i'?m done|thanks,? donna|thank you,? donna)\b/i;

  async function ask(text, spoken) {
    text = (text || "").trim();
    if (!text || busy) return;
    if (!key) { showSetup(); return; }
    talking = !!spoken && !DONE.test(text);
    busy = true; $("mic").disabled = true;
    add("me", text); status("Donna is thinking…");
    let reply = "";
    try {
      const r = await fetch("/api/donna", {
        method: "POST",
        headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
        body: JSON.stringify({ text, convo }),
      });
      if (r.status === 404) { add("note", "That key didn't work. Paste it again."); key = ""; store.set("donnaKey", ""); showSetup(); talking = false; return; }
      reply = (await r.text()).trim();
      add("her", reply); status("");
    } catch (e) {
      add("note", "Couldn't reach Donna. Check your connection and try again."); status(""); talking = false;
    } finally { busy = false; $("mic").disabled = false; }
    if (!reply) return;
    if (!(await voiced(reply))) await say(reply);
    if (talking) setTimeout(() => listen(true), 250);
  }

  // The real conversation: Scott's private ElevenLabs agent, which listens, knows when he's finished, lets him
  // interrupt and answers in her voice (asking the server for anything about the business). The server hands out a
  // short-lived link to it. If that isn't set up or doesn't work, the mic falls back to tap-to-talk below.
  let agent = null, agentOK = true, connecting = false, why = "";
  async function loadSDK() {
    for (const url of ["https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm", "https://cdn.jsdelivr.net/npm/@11labs/client/+esm"]) {
      try { const m = await import(url); if (m.Conversation) return m.Conversation; } catch (e) {}
    }
    return null;
  }
  async function startAgent() {
    connecting = true; mode("connecting"); status("Connecting…");
    try {
      const r = await fetch("/api/donna/agent", { method: "POST", headers: { "Authorization": "Bearer " + key } });
      if (r.status === 401) { add("note", "That key didn't work. Paste it again."); key = ""; store.set("donnaKey", ""); showSetup(); return true; }
      if (r.status !== 200) { why = "the server couldn't open your agent (" + r.status + ")"; return false; }
      const { signed_url } = await r.json();
      const Conversation = await loadSDK();
      if (!Conversation) { why = "the ElevenLabs voice engine didn't load"; return false; }
      if (!signed_url) { why = "the server sent no link"; return false; }
      await navigator.mediaDevices.getUserMedia({ audio: true });
      agent = await Conversation.startSession({
        signedUrl: signed_url, connectionType: "websocket",
        onConnect: () => { mode("listening"); status("Listening · tap to hang up"); },
        onDisconnect: () => { agent = null; mode(""); status(""); },
        onModeChange: m => { if (agent) { mode(m.mode === "speaking" ? "speaking" : "listening");
                                          status(m.mode === "speaking" ? "Donna" : "Listening · tap to hang up"); } },
        onMessage: m => { if (m && m.message) add(m.source === "user" ? "me" : "her", m.message); },
        onError: e => { add("note", "Connection trouble: " + (e && e.message ? e.message : e)); },
      });
      return true;
    } catch (e) {
      if (e && e.name === "NotAllowedError") { add("note", "Allow the microphone: Settings → Apps → Safari → Microphone → Allow."); return true; }
      why = "starting the conversation failed: " + ((e && (e.message || e.name)) || e);
      return false;
    } finally { connecting = false; if (!agent) mode(""); }
  }

  let current = null;  // the microphone while it's listening: tapping the mic again stops it and sends what you said
  async function micTap() {
    if (!key) { showSetup(); return; }
    if (agent) { try { await agent.endSession(); } catch (e) {} agent = null; return; }
    if (connecting) return;
    if (listening && current) { status("Got it…"); try { current.stop(); } catch (e) {} return; }
    if (agentOK && !busy) {
      if (await startAgent()) return;
      agentOK = false;  // not set up: tap-to-talk for the rest of this visit
      add("note", "Couldn't start the live conversation: " + (why || "unknown reason") + ". Using tap-to-talk instead.");
      status("");
    }
    listen(false);
  }

  function listen(auto) {
    if (!key) { showSetup(); return; }
    if (!Rec) { status("Voice isn't available in this browser. Type below."); $("typed").focus(); return; }
    if (listening || busy) return;
    if (!auto) { player.pause(); if ("speechSynthesis" in window) speechSynthesis.cancel(); unlock(); }  // a tap interrupts her
    if (!auto && "speechSynthesis" in window) speechSynthesis.speak(new SpeechSynthesisUtterance(""));  // unlocks speech on iPhone
    const rec = new Rec();
    current = rec;
    rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true;
    // The phone waits a long time to decide you've stopped talking: stop after a short pause instead, and give up
    // quietly if nothing is said at all.
    let quiet = null;
    const stopSoon = ms => { clearTimeout(quiet); quiet = setTimeout(() => { try { rec.stop(); } catch (e) {} }, ms); };
    stopSoon(auto ? 7000 : 9000);
    let heard = "";
    rec.onstart = () => { listening = true; mode("listening"); status("Listening · tap when you're done"); };
    rec.onresult = e => { heard = Array.from(e.results).map(r => r[0].transcript).join(" "); status(heard + "  (tap the mic to send)"); stopSoon(1100); };
    rec.onerror = e => {
      if (auto) return;  // the phone wouldn't let her start listening on her own: onend asks for a tap
      if (e.error === "not-allowed" || e.error === "service-not-allowed")
        add("note", "Allow the microphone for this page: Settings → Apps → Safari → Microphone → Allow (and Speech Recognition).");
    };
    rec.onend = () => {
      clearTimeout(quiet); listening = false; current = null; mode("");
      if (heard.trim()) { status(""); ask(heard, true); }
      else status(auto ? "Tap the mic to keep talking." : "");
    };
    try { rec.start(); } catch (e) { status(auto ? "Tap the mic to keep talking." : "Tap the mic again."); }
  }

  function showSetup() { $("setup").style.display = "flex"; $("key").focus(); }
  $("keyform").onsubmit = e => {
    e.preventDefault();
    key = $("key").value.trim(); store.set("donnaKey", key); $("key").value = "";
    $("setup").style.display = "none"; add("note", "Saved. Tap the mic and talk.");
  };
  $("typeform").onsubmit = e => { e.preventDefault(); unlock(); const t = $("typed").value; $("typed").value = ""; ask(t, false); };
  $("mic").onclick = micTap;
  $("typeToggle").onclick = () => { document.body.classList.toggle("typing");
    $("typeToggle").textContent = document.body.classList.contains("typing") ? "Hide keyboard" : "Type instead";
    if (document.body.classList.contains("typing")) $("typed").focus(); };

  if (!key) showSetup(); else status("");
})();
</script>
</body></html>
