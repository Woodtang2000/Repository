<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Donna">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Donna</title>
<link rel="apple-touch-icon" href="/donna-icon.png">
<link rel="icon" href="/donna-icon.png">
<style>
  :root{--bg:#002a35;--card:#0b4152;--ink:#f2f6f7;--dim:#a9c0c6;--gold:#f9af10;--me:#14566a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
  header{text-align:center;padding:18px 0 6px}
  header h1{margin:0;font-size:26px;letter-spacing:.5px}
  header p{margin:4px 0 0;color:var(--dim);font-size:14px}
  #log{flex:1;overflow-y:auto;padding:10px 0;display:flex;flex-direction:column;gap:10px}
  .b{max-width:85%;padding:10px 14px;border-radius:18px;font-size:17px;line-height:1.35;white-space:pre-wrap}
  .me{align-self:flex-end;background:var(--me)}
  .her{align-self:flex-start;background:var(--card)}
  .note{align-self:center;color:var(--dim);font-size:14px;text-align:center}
  #controls{padding:10px 0 22px;display:flex;flex-direction:column;align-items:center;gap:12px}
  #mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--gold);color:#111;font-size:40px;box-shadow:0 0 0 0 rgba(249,175,16,.6)}
  #mic.on{animation:pulse 1.2s infinite}
  #mic:disabled{opacity:.5}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(249,175,16,.6)}70%{box-shadow:0 0 0 22px rgba(249,175,16,0)}100%{box-shadow:0 0 0 0 rgba(249,175,16,0)}}
  #status{color:var(--dim);font-size:15px;min-height:20px}
  form{display:flex;gap:8px;width:100%}
  input{flex:1;font-size:17px;padding:10px 12px;border-radius:12px;border:1px solid #1d5a6c;background:var(--card);color:var(--ink)}
  button.small{font-size:16px;padding:10px 14px;border-radius:12px;border:0;background:#14566a;color:var(--ink)}
  #setup{display:none;flex-direction:column;gap:10px;padding:20px 0}
  #setup p{color:var(--dim);margin:0}
</style>
</head><body>
<header><h1>Donna</h1><p id="sub">Tap to talk to Donna.</p></header>

<div id="setup">
  <p>One-time setup: paste your Donna key (from the server). It stays on this phone only.</p>
  <form id="keyform"><input id="key" type="password" autocomplete="off" placeholder="Paste key"><button class="small">Save</button></form>
</div>

<div id="log"></div>

<div id="controls">
  <button id="mic" aria-label="Talk">🎙️</button>
  <div id="status"></div>
  <form id="typeform"><input id="typed" placeholder="Or type here" autocomplete="off"><button class="small">Send</button></form>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let key = store.get("donnaKey") || "";
  const convo = "phone-" + (store.get("donnaConvo") || (Date.now() + "")); store.set("donnaConvo", convo.slice(6));
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let busy = false, listening = false, voice = null;

  function add(cls, text) {
    const d = document.createElement("div"); d.className = "b " + cls; d.textContent = text;
    if (cls === "note") d.className = "note";
    $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
  }
  function status(t) { $("status").textContent = t || ""; }

  function pickVoice() {
    const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    const like = ["Ava (Premium)", "Zoe (Premium)", "Ava (Enhanced)", "Zoe (Enhanced)", "Samantha (Enhanced)", "Ava", "Zoe", "Samantha"];
    for (const n of like) { const v = vs.find(v => v.name === n); if (v) return v; }
    return vs.find(v => /female|samantha|ava|zoe|allison|susan/i.test(v.name)) || vs[0] || null;
  }
  if ("speechSynthesis" in window) { voice = pickVoice(); speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); }; }

  // Donna's own voice (ElevenLabs, through the server). iPhone only plays sound started by a tap, so the tap that
  // sends a question also "unlocks" this player with a moment of silence; the answer then plays in it.
  const player = new Audio();
  player.setAttribute("playsinline", "");
  const SILENCE = "data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//WreyTRUoAWgBgkOAGbZHBgG1OF6zM82DWbZaUmMBptgQhGjsyYqc9ae9XFz280948NMBWInljyzsNRFLPWdnZGWrddDsjK1unuSrVN9jJsK8KuQtQCtMBjCEtImISdNKJOopIpBFpNSMbIHCSRpRR5iakjTiyzLhchUUBwCgyKiweBv/7UsQbg8isVNoMPMjAAAA0gAAABEVFGmgqK////9bP/6XCykxBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq";
  function unlock() { try { player.src = SILENCE; const p = player.play(); if (p) p.catch(() => {}); } catch (e) {} }

  // Speaks `text` and resolves when she's finished (true), or false if her own voice isn't available.
  async function voiced(text) {
    try {
      const r = await fetch("/api/donna/voice", {
        method: "POST",
        headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (r.status !== 200) return false;
      const url = URL.createObjectURL(await r.blob());
      await new Promise(done => {
        player.onended = player.onpause = done;
        player.onerror = done;
        player.src = url;
        player.play().catch(done);
      });
      return true;
    } catch (e) { return false; }
  }

  function say(text) {
    return new Promise(done => {
      if (!("speechSynthesis" in window)) return done();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.rate = 1.08;
      u.onend = u.onerror = done;
      speechSynthesis.speak(u);
    });
  }

  // A conversation: after she answers a spoken question, she listens for the reply on her own, until "goodbye".
  let talking = false;
  const DONE = /\b(good ?bye|bye|that'?s all|that is all|i'?m done|thanks,? donna|thank you,? donna)\b/i;

  async function ask(text, spoken) {
    text = (text || "").trim();
    if (!text || busy) return;
    if (!key) { showSetup(); return; }
    talking = !!spoken && !DONE.test(text);
    busy = true; $("mic").disabled = true;
    add("me", text); status("Donna is thinking…");
    let reply = "";
    try {
      const r = await fetch("/api/donna", {
        method: "POST",
        headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
        body: JSON.stringify({ text, convo }),
      });
      if (r.status === 404) { add("note", "That key didn't work. Paste it again."); key = ""; store.set("donnaKey", ""); showSetup(); talking = false; return; }
      reply = (await r.text()).trim();
      add("her", reply); status("");
    } catch (e) {
      add("note", "Couldn't reach Donna. Check your connection and try again."); status(""); talking = false;
    } finally { busy = false; $("mic").disabled = false; }
    if (!reply) return;
    if (!(await voiced(reply))) await say(reply);
    if (talking) setTimeout(() => listen(true), 250);
  }

  // The real conversation: Scott's private ElevenLabs agent, which listens, knows when he's finished, lets him
  // interrupt and answers in her voice (asking the server for anything about the business). The server hands out a
  // short-lived link to it. If that isn't set up or doesn't work, the mic falls back to tap-to-talk below.
  let agent = null, agentOK = true, connecting = false;
  async function loadSDK() {
    for (const url of ["https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm", "https://cdn.jsdelivr.net/npm/@11labs/client/+esm"]) {
      try { const m = await import(url); if (m.Conversation) return m.Conversation; } catch (e) {}
    }
    return null;
  }
  async function startAgent() {
    connecting = true; $("mic").classList.add("on"); status("Connecting…");
    try {
      const r = await fetch("/api/donna/agent", { method: "POST", headers: { "Authorization": "Bearer " + key } });
      if (r.status === 401) { add("note", "That key didn't work. Paste it again."); key = ""; store.set("donnaKey", ""); showSetup(); return true; }
      if (r.status !== 200) return false;
      const { signed_url } = await r.json();
      const Conversation = await loadSDK();
      if (!Conversation || !signed_url) return false;
      await navigator.mediaDevices.getUserMedia({ audio: true });
      agent = await Conversation.startSession({
        signedUrl: signed_url, connectionType: "websocket",
        onConnect: () => { status("Listening… just talk. Tap to hang up."); },
        onDisconnect: () => { agent = null; $("mic").classList.remove("on"); status("Tap to talk to Donna."); },
        onModeChange: m => { if (agent) status(m.mode === "speaking" ? "Donna is talking… (just talk to interrupt)" : "Listening…"); },
        onMessage: m => { if (m && m.message) add(m.source === "user" ? "me" : "her", m.message); },
        onError: e => { add("note", "Connection trouble: " + (e && e.message ? e.message : e)); },
      });
      return true;
    } catch (e) {
      if (e && e.name === "NotAllowedError") { add("note", "Allow the microphone: Settings → Apps → Safari → Microphone → Allow."); return true; }
      return false;
    } finally { connecting = false; if (!agent) $("mic").classList.remove("on"); }
  }

  let current = null;  // the microphone while it's listening: tapping the mic again stops it and sends what you said
  async function micTap() {
    if (!key) { showSetup(); return; }
    if (agent) { try { await agent.endSession(); } catch (e) {} agent = null; return; }
    if (connecting) return;
    if (listening && current) { status("Got it…"); try { current.stop(); } catch (e) {} return; }
    if (agentOK && !busy) {
      if (await startAgent()) return;
      agentOK = false;  // not set up: tap-to-talk for the rest of this visit
      status("");
    }
    listen(false);
  }

  function listen(auto) {
    if (!key) { showSetup(); return; }
    if (!Rec) { status("Voice isn't available in this browser. Type below."); $("typed").focus(); return; }
    if (listening || busy) return;
    if (!auto) { player.pause(); if ("speechSynthesis" in window) speechSynthesis.cancel(); unlock(); }  // a tap interrupts her
    if (!auto && "speechSynthesis" in window) speechSynthesis.speak(new SpeechSynthesisUtterance(""));  // unlocks speech on iPhone
    const rec = new Rec();
    current = rec;
    rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true;
    // The phone waits a long time to decide you've stopped talking: stop after a short pause instead, and give up
    // quietly if nothing is said at all.
    let quiet = null;
    const stopSoon = ms => { clearTimeout(quiet); quiet = setTimeout(() => { try { rec.stop(); } catch (e) {} }, ms); };
    stopSoon(auto ? 7000 : 9000);
    let heard = "";
    rec.onstart = () => { listening = true; $("mic").classList.add("on"); status("Listening… tap the mic when you're done"); };
    rec.onresult = e => { heard = Array.from(e.results).map(r => r[0].transcript).join(" "); status(heard + "  (tap the mic to send)"); stopSoon(1100); };
    rec.onerror = e => {
      if (auto) return;  // the phone wouldn't let her start listening on her own: onend asks for a tap
      if (e.error === "not-allowed" || e.error === "service-not-allowed")
        add("note", "Allow the microphone for this page: Settings → Apps → Safari → Microphone → Allow (and Speech Recognition).");
    };
    rec.onend = () => {
      clearTimeout(quiet); listening = false; current = null; $("mic").classList.remove("on");
      if (heard.trim()) { status(""); ask(heard, true); }
      else status(auto ? "Tap the mic to keep talking." : "");
    };
    try { rec.start(); } catch (e) { status(auto ? "Tap the mic to keep talking." : "Tap the mic again."); }
  }

  function showSetup() { $("setup").style.display = "flex"; $("key").focus(); }
  $("keyform").onsubmit = e => {
    e.preventDefault();
    key = $("key").value.trim(); store.set("donnaKey", key); $("key").value = "";
    $("setup").style.display = "none"; add("note", "Saved. Tap the mic and talk.");
  };
  $("typeform").onsubmit = e => { e.preventDefault(); unlock(); const t = $("typed").value; $("typed").value = ""; ask(t, false); };
  $("mic").onclick = micTap;

  if (!key) showSetup(); else add("note", "Tap the button and just talk. Tap again to hang up.");
})();
</script>
</body></html>
