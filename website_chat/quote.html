<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Get a quote · __TITLE__</title>
<style>
:root{--navy:#003746;--gold:#f9af10;--ink:#1c2226;--sub:#5f6b72;--line:#e3e7ea;--bg:#f5f6f7;--card:#fff;--tint:rgba(0,55,70,.08)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em}
header{background:#fff;border-bottom:4px solid var(--gold)}
.top{max-width:1040px;margin:0 auto;padding:18px 16px;display:flex;align-items:center;gap:16px}
.top img{height:56px;width:auto}
.top a{margin-left:auto;color:var(--navy);font-weight:600;text-decoration:none;white-space:nowrap}
.hero{background:var(--navy);color:#fff}
.hero div{max-width:1040px;margin:0 auto;padding:28px 16px 30px}
.hero h1{margin:0 0 6px;font-size:32px;line-height:1.15;letter-spacing:-.02em}
.hero p{margin:0;color:#d5e1e5;max-width:640px}
main{max-width:1040px;margin:0 auto;padding:8px 16px 140px}
h2{font-size:22px;margin:30px 0 4px;letter-spacing:-.015em;color:var(--navy)}
.lead{margin:0 0 14px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.item{background:var(--card);border:2px solid transparent;border-radius:14px;padding:9px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:7px;transition:border-color .15s}
.item.on{border-color:var(--gold)}
.pic{aspect-ratio:3/2;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;background:#fff}
.pic span{font-size:30px;font-weight:700;color:rgba(0,55,70,.35)}
.name{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;line-height:1.25;text-align:center;color:var(--navy);min-height:2.5em;display:flex;align-items:center;justify-content:center}
.note{font-size:12.5px;color:var(--sub);margin-top:2px;text-align:center}
.seg{justify-content:center}
.seg.yn{justify-content:flex-start;gap:8px}
.seg.yn button{padding:10px 26px;font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:0;border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;font-weight:600;background:var(--tint);color:var(--navy);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.qty{display:flex;align-items:center;gap:6px;margin-top:auto}
.qty.opt{margin-top:0}
.qty.opt label{font-weight:600;color:var(--navy);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cap{font-size:12px;color:var(--sub);text-align:center;margin-top:auto}
.qty label{font-size:13px;color:var(--sub);margin-right:auto;white-space:nowrap}
.qty button{width:30px;height:30px;flex:none;border:0;border-radius:8px;background:var(--tint);color:var(--navy);font-size:19px;font-weight:600;line-height:1;cursor:pointer}
.qty input{width:46px;height:30px;flex:none;border:1px solid var(--line);border-radius:8px;text-align:center;font:inherit;font-size:15px;font-weight:600;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.how{width:100%;border:0;border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;font-weight:600;background:var(--tint);color:var(--navy)}
.box{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
textarea,input[type=text],input[type=email],input[type=tel],input[type=month],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .wide{grid-column:1/-1}
.fields label{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.fields label i{font-style:normal;font-weight:400;color:var(--sub)}
.checks label{display:flex;gap:10px;align-items:center;padding:8px 0;font-weight:500}
.checks input{width:20px;height:20px;accent-color:var(--navy)}
.hp{position:absolute;left:-5000px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line);z-index:5}
.bar div{max-width:1040px;margin:0 auto;padding:12px 96px 12px 16px;display:flex;align-items:center;gap:12px}
.bar span{color:var(--sub);font-size:15px;margin-right:auto}
.bar b{color:var(--ink)}
.btn{border:0;border-radius:12px;padding:13px 22px;font:inherit;font-size:17px;font-weight:600;background:var(--gold);color:#1c2226;cursor:pointer;white-space:nowrap}
.btn:active{opacity:.7}.btn:disabled{opacity:.45}
.err{color:#b3261e;font-weight:600;margin:12px 0 0;min-height:1em}
.done{background:var(--card);border-radius:16px;padding:28px 20px;margin-top:24px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.done h2{margin-top:0}
.small{font-size:14px;color:var(--sub)}
.step{margin:26px 0 -18px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#a87400}
.go{display:flex;justify-content:flex-end;margin-top:4px}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border-radius:14px;padding:10px 14px;margin-top:18px;box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:600}
.who span{margin-right:auto}
.who button{border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;font-weight:600;background:var(--tint);color:var(--navy);cursor:pointer}
[hidden]{display:none!important}
h3{font-size:17px;margin:22px 0 8px;color:var(--navy)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tile{display:flex;align-items:center;justify-content:center;text-align:center;height:76px;padding:8px 14px;background:#fff;color:var(--navy);border:1.5px solid var(--navy);border-radius:8px;font:inherit;font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.25;cursor:pointer;transition:background-color .15s,color .15s}
.tile:after{content:"\00a0\203A";font-weight:700}
.tile:hover,.tile.on{background:var(--navy);color:#fff}
.typeline{display:flex;align-items:center;gap:10px;margin-top:26px}
.typeline span{font-weight:700;color:var(--navy)}
.typeline button{border:0;border-radius:8px;padding:5px 9px;font:inherit;font-size:13px;font-weight:600;background:var(--tint);color:var(--navy);cursor:pointer}
.more{display:block;margin:22px auto 0;border:2px solid var(--navy);border-radius:12px;background:#fff;color:var(--navy);font:inherit;font-weight:600;padding:12px 20px;cursor:pointer}
.note2{color:var(--ink);margin:0 0 6px}
@media (max-width:640px){.tiles{grid-template-columns:1fr 1fr;gap:8px}.tile{font-size:12.5px;height:70px;padding:6px 8px}}
@media (max-width:640px){.hero h1{font-size:26px}.top img{height:44px}.fields{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;gap:8px}.pic{aspect-ratio:auto;height:92px}.qty label{display:none}.qty.opt label{display:block;font-size:12.5px}.qty{justify-content:space-between}.bar div{padding-right:92px}.bar span{font-size:14px}}
</style>
</head>
<body>
<header><div class="top"><img id="logo" alt=""><a href="tel:+19072227738">(907) 222-7738</a></div></header>
<section class="hero"><div><h1>Get a quote</h1><p id="intro"></p></div></section>
<main id="main"></main>
<div class="bar" id="bar"><div><span id="count"></span><button class="btn" id="next" type="button">Send my request</button></div></div>
<script>
(function () {
  var C = __CONFIG__;
  var cat = C.catalog, state = {}, sent = false;
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in attrs || {}) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'cls') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  $('logo').src = C.logo; $('logo').alt = C.name;
  document.title = 'Get a quote · ' + C.name;
  $('intro').textContent = 'Tell us about your business, pick what you need, and Bill will put together your quote. No prices to figure out and no obligation.';

  function count() {
    var n = 0; for (var k in state) if (state[k].qty > 0) n++;
    var extras = (cat.interests || []).filter(function (i) { return picked[i]; }).length;
    $('count').innerHTML = n || extras ? '<b>' + (n + extras) + '</b> selected' : 'Nothing selected yet';
  }

  function opts(it) { return it.options || [{ label: '', sku: it.sku }]; }
  function card(group, it) {
    var pic = el('div', { cls: 'pic' });
    var showPic = function (sku) {
      pic.innerHTML = '';
      if (sku && it.picture) pic.appendChild(el('img', { src: C.api + '/catalog/' + sku + '.img', alt: it.name, loading: 'lazy' }));
      else pic.appendChild(el('span', { text: it.name.charAt(0) }));
    };
    showPic(it.picture);
    var box = el('div', { cls: 'item' }, [pic, el('div', {}, [el('div', { cls: 'name', text: it.name }), it.note ? el('div', { cls: 'note', text: it.note }) : null])]);
    var many = !!it.options;
    if (many) box.appendChild(el('div', { cls: 'cap', text: group.garments ? 'Employees for each' : 'How many of each, per week' }));
    var mark = function () { box.className = 'item' + (opts(it).some(function (o) { return (state[it.id + '|' + o.label] || {}).qty; }) ? ' on' : ''); };
    opts(it).forEach(function (o) {
      var key = it.id + '|' + o.label;
      var s = state[key] = state[key] || { id: it.id, option: o.label, qty: 0 };
      var input = el('input', { type: 'number', min: '0', max: '5000', inputmode: 'numeric', value: String(s.qty), 'aria-label': (group.garments ? 'Employees for ' : 'Quantity of ') + it.name + (o.label ? ' ' + o.label : '') });
      var set = function (v) { v = Math.max(0, Math.min(5000, parseInt(v, 10) || 0)); s.qty = v; input.value = v; mark(); count(); };
      var minus = el('button', { type: 'button', text: '−', 'aria-label': 'Less' }), plus = el('button', { type: 'button', text: '+', 'aria-label': 'More' });
      minus.onclick = function () { set(s.qty - 1); }; plus.onclick = function () { set(s.qty + 1); if (many && it.picture) showPic(o.sku); };
      input.oninput = function () { set(input.value); };
      var row = el('div', { cls: 'qty' + (many ? ' opt' : '') }, [el('label', { text: o.label || (group.garments ? 'Employees' : 'Per week') }), minus, input, plus]);
      if (many && it.picture) row.onmouseenter = function () { showPic(o.sku); };
      box.appendChild(row);
    });
    mark();
    return box;
  }

  var main = $('main');
  var step1 = el('section', { id: 'step1' }), step2 = el('section', { id: 'step2', hidden: '' }), step3 = el('section', { id: 'step3', hidden: '' });
  main.appendChild(step1); main.appendChild(step2); main.appendChild(step3);
  var industry = null;

  // Step 1: about the business
  var f = function (id, label, type, opt, wide) {
    var input = type === 'select' ? el('select', { id: id }, opt.map(function (o) { return el('option', { value: o, text: o || 'Choose one' }); }))
      : type === 'textarea' ? el('textarea', { id: id, maxlength: '1500' }) : el('input', { id: id, type: type, maxlength: '300', autocomplete: opt || 'off' });
    var lab = el('label', { 'for': id }); lab.innerHTML = label;
    return el('div', { cls: wide ? 'wide' : '' }, [lab, input]);
  };
  var contractEnd = f('contract_end', 'When does that contract end? <i>(optional)</i>', 'month');
  contractEnd.hidden = true;
  function yesNo() {
    var hidden = el('input', { type: 'hidden', id: 'current_provider', value: '' });
    var seg = el('div', { cls: 'seg yn', role: 'group', 'aria-label': 'Currently using a linen supply company' });
    [['Yes', 'Yes, has a linen company now'], ['No', 'No linen company now']].forEach(function (o) {
      var b = el('button', { type: 'button', text: o[0] });
      b.onclick = function () { hidden.value = o[1]; [].forEach.call(seg.children, function (x) { x.className = x === b ? 'on' : ''; }); contractEnd.hidden = o[0] !== 'Yes'; if (o[0] !== 'Yes') $('contract_end').value = ''; };
      seg.appendChild(b);
    });
    var lab = el('label'); lab.innerHTML = 'Are you currently using a linen supply company? <i>(optional)</i>';
    return el('div', {}, [lab, seg, hidden]);
  }
  step1.appendChild(el('p', { cls: 'step', text: 'Step 1 of 3' }));
  step1.appendChild(el('h2', { text: 'About your business' }));
  step1.appendChild(el('p', { cls: 'lead', text: 'So Bill can send your quote and plan your route stop.' }));
  step1.appendChild(el('div', { cls: 'box fields' }, [
    f('name', 'Your name', 'text', 'name'), f('business', 'Business name', 'text', 'organization'),
    f('phone', 'Phone <i>(phone or email)</i>', 'tel', 'tel'), f('email', 'Email', 'email', 'email'),
    f('street', 'Street address', 'text', 'street-address', true),
    f('town', 'City', 'text', 'address-level2'), f('zip', 'ZIP', 'text', 'postal-code'),
    f('size', cat.size_label + ' <i>(optional)</i>', 'text'),
    yesNo(),
    contractEnd,
    f('best_time', 'Best time to reach you <i>(optional)</i>', 'text'),
    el('input', { id: 'website', cls: 'hp', tabindex: '-1', autocomplete: 'off', 'aria-hidden': 'true' })
  ]));
  var err1 = el('p', { cls: 'err', role: 'alert' });
  step1.appendChild(err1);
  step1.appendChild(el('div', { cls: 'go' }, [el('button', { cls: 'btn', id: 'toType', type: 'button', text: 'Continue' })]));
  step1.appendChild(el('p', { cls: 'small', text: 'We only use your details to prepare your quote. Please don’t enter payment information here.' }));

  // Step 2: what kind of business
  var who = function () {
    var box = el('div', { cls: 'who' }, [el('span', { text: 'Quote for ' + v('business') + ' · ' + v('name') })]);
    var edit = el('button', { type: 'button', text: 'Edit details' }); edit.onclick = function () { show(1); };
    box.appendChild(edit);
    return box;
  };
  function buildStep2() {
    step2.innerHTML = '';
    step2.appendChild(who());
    step2.appendChild(el('p', { cls: 'step', text: 'Step 2 of 3' }));
    step2.appendChild(el('h2', { text: 'What kind of business is it?' }));
    step2.appendChild(el('p', { cls: 'lead', text: 'We’ll show what businesses like yours use most. You can still see everything.' }));
    var tiles = el('div', { cls: 'tiles' });
    cat.industries.forEach(function (ind) {
      var t = el('button', { type: 'button', cls: 'tile' + (industry === ind ? ' on' : ''), text: ind.name });
      t.onclick = function () { industry = ind; buildStep3(); show(3); };
      tiles.appendChild(t);
    });
    step2.appendChild(tiles);
  }

  // Step 3: products, suggested first
  function buildStep3() {
    step3.innerHTML = '';
    step3.appendChild(who());
    step3.appendChild(el('p', { cls: 'step', text: 'Step 3 of 3' }));
    var all = industry.all, pick = {};
    (industry.suggest || []).forEach(function (id) { pick[id] = true; });
    // each section shown gets at least five items (or all it has), topped up in catalog order, which is most used first
    cat.groups.forEach(function (g) {
      var n = g.items.filter(function (it) { return pick[it.id]; }).length;
      g.items.forEach(function (it) { if (n && n < 5 && !pick[it.id]) { pick[it.id] = true; n++; } });
    });
    var top = el('div', { cls: 'typeline' }, [el('span', { text: industry.name })]);
    var change = el('button', { type: 'button', text: 'Change' }); change.onclick = function () { show(2); };
    top.appendChild(change);
    step3.appendChild(top);
    step3.appendChild(el('h2', { text: all ? 'Pick what you need' : 'Popular with businesses like yours', cls: 'first' }));
    step3.appendChild(el('p', { cls: 'lead', text: 'Choose a size or color and how many you need each week. Skip anything you don’t need.' }));
    if (industry.note) step3.appendChild(el('p', { cls: 'box note2', text: industry.note }));
    function section(into, keep) {
      cat.groups.forEach(function (g) {
        var items = g.items.filter(function (it) { return keep(it); });
        if (!items.length) return;
        into.appendChild(el('h3', { text: g.name }));
        if (g.note) into.appendChild(el('p', { cls: 'lead', text: g.note }));
        var grid = el('div', { cls: 'grid' });
        items.forEach(function (it) { grid.appendChild(card(g, it)); });
        into.appendChild(grid);
      });
    }
    section(step3, function (it) { return all || pick[it.id]; });
    if (!all) {
      var more = el('div', { hidden: '' });
      var rest = 0; cat.groups.forEach(function (g) { g.items.forEach(function (it) { if (!pick[it.id]) rest++; }); });
      var btn = el('button', { type: 'button', cls: 'more', text: 'Show all products (' + rest + ' more)' });
      btn.onclick = function () { more.hidden = false; btn.remove(); };
      step3.appendChild(btn);
      more.appendChild(el('h2', { text: 'All other products' }));
      section(more, function (it) { return !pick[it.id]; });
      step3.appendChild(more);
      if (cat.groups.some(function (g) { return g.items.some(function (it) { return !pick[it.id] && opts(it).some(function (o) { return (state[it.id + '|' + o.label] || {}).qty; }); }); })) btn.click();
    }
    if (cat.interests) {
      step3.appendChild(el('h2', { text: 'Equipment and supplies' }));
      var checks = el('div', { cls: 'box checks' });
      cat.interests.forEach(function (i) {
        var cb = el('input', { type: 'checkbox', 'data-interest': i }); cb.checked = !!picked[i]; cb.onchange = function () { picked[i] = cb.checked; count(); };
        checks.appendChild(el('label', {}, [cb, document.createTextNode(i)]));
      });
      step3.appendChild(checks);
    }
    step3.appendChild(el('h2', { text: 'Need something else?' }));
    step3.appendChild(el('p', { cls: 'lead', text: "Don't see it here? Tell us what you need. We can get other items, colors and sizes." }));
    var other = el('textarea', { id: 'other', maxlength: '1500', placeholder: 'For example: hi-vis shirts, a 3 x 5 scraper mat, table linens for 20 tables' });
    other.value = texts.other || ''; other.oninput = function () { texts.other = other.value; };
    step3.appendChild(el('div', { cls: 'box' }, [other]));
    step3.appendChild(el('h2', { text: 'Anything else Bill should know?' }));
    var notes = el('textarea', { id: 'notes', maxlength: '1500', 'aria-label': 'Anything else Bill should know', placeholder: 'Optional' });
    notes.value = texts.notes || ''; notes.oninput = function () { texts.notes = notes.value; };
    step3.appendChild(el('div', { cls: 'box' }, [notes]));
    err = el('p', { cls: 'err', role: 'alert' });
    step3.appendChild(err);
    count();
  }
  var picked = {}, texts = {}, err = el('p');
  var v = function (id) { var e = $(id); return e ? e.value.trim() : ''; };
  function details() {
    if (!v('name') || !v('business')) { err1.textContent = 'Please enter your name and your business name.'; $(v('name') ? 'business' : 'name').focus(); return false; }
    if (!v('phone') && !v('email')) { err1.textContent = 'Please enter a phone number or email so Bill can send your quote.'; $('phone').focus(); return false; }
    if (v('email') && !/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(v('email'))) { err1.textContent = 'That email address doesn’t look right.'; $('email').focus(); return false; }
    err1.textContent = '';
    return true;
  }
  function show(step) {
    if (step === 2) buildStep2();
    step1.hidden = step !== 1; step2.hidden = step !== 2; step3.hidden = step !== 3;
    $('bar').style.display = step === 3 ? '' : 'none';
    window.scrollTo(0, 0);
  }
  $('toType').onclick = function () { if (details()) show(2); };
  show(1);

  function submit() {
    if (sent) return;
    var items = [];
    cat.groups.forEach(function (g) { g.items.forEach(function (it) { opts(it).forEach(function (o) { var s = state[it.id + '|' + o.label]; if (s && s.qty > 0) items.push({ id: it.id, qty: s.qty, option: o.label }); }); }); });
    var interests = (cat.interests || []).filter(function (i) { return picked[i]; });
    if (!items.length && !interests.length && !v('other')) { err.textContent = 'Please pick at least one item, or tell us what you need.'; err.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    if (!details()) { show(1); return; }
    var body = { site: C.site, items: items, interests: interests, other: v('other'), website: v('website'), business_type: industry && !industry.all ? industry.name : '' };
    ['name', 'business', 'phone', 'email', 'street', 'town', 'zip', 'size', 'current_provider', 'contract_end', 'best_time', 'notes'].forEach(function (k) { body[k] = v(k); });
    err.textContent = ''; $('next').disabled = true; $('next').textContent = 'Sending…';
    fetch(C.api + '/api/quote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (out) {
        if (!out.ok) throw new Error(out.error || 'Something went wrong.');
        var first = v('name').split(' ')[0];
        sent = true;
        main.innerHTML = '';
        main.appendChild(el('div', { cls: 'done' }, [el('h2', { text: 'Thanks, ' + first + '!' }),
          el('p', { text: 'Your request is on its way to Bill Dubinsky. He’ll be in touch soon with your quote.' }),
          el('p', { cls: 'small', text: 'Questions in the meantime? Call (907) 222-7738.' })]));
        $('bar').style.display = 'none';
        window.scrollTo(0, 0);
      })
      .catch(function (e) { err.textContent = e.message === 'Failed to fetch' ? 'We couldn’t send that. Please check your connection and try again.' : e.message; err.scrollIntoView({ block: 'center' }); $('next').disabled = false; $('next').textContent = 'Send my request'; });
  }
  $('next').onclick = submit;
